<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobMax — Parallel Scheduler</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0f0a; --surface: #141810; --surface2: #1c2118;
    --border: #2a3326; --accent: #7ef56a; --accent2: #f5e96a;
    --accent3: #6ab8f5; --text: #e8f0e4; --muted: #6b7c65;
    --danger: #f56a6a; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* TOPBAR */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border); background: rgba(12,15,10,0.95); position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 18px; height: 18px; }
  .logo-text { font-size: 18px; font-weight: 800; }
  .logo-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--accent); background: rgba(126,245,106,0.1); border: 1px solid rgba(126,245,106,0.2); padding: 3px 8px; border-radius: 20px; margin-left: 8px; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .btn { padding: 8px 16px; border-radius: 8px; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; border: none; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: #0c0f0a; }
  .btn-primary:hover { background: #9dff8a; }
  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--muted); color: var(--text); }
  .btn-danger-sm { background: transparent; color: var(--danger); border: none; font-size: 12px; cursor: pointer; padding: 4px 8px; font-family: 'Syne', sans-serif; font-weight: 600; }
  .btn-danger-sm:hover { text-decoration: underline; }

  .content { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

  /* PLATFORM STATS */
  .platform-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 32px; }
  .pstat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .pstat.highlight { border-color: rgba(126,245,106,0.3); background: rgba(126,245,106,0.04); }
  .ps-label { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .ps-val { font-size: 28px; font-weight: 800; }
  .ps-val.green { color: var(--accent); }

  /* ADD WORKER */
  .section-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
  .add-worker-bar { display: flex; gap: 10px; margin-bottom: 32px; flex-wrap: wrap; align-items: center; }
  .worker-name-input { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none; width: 200px; transition: border-color 0.15s; }
  .worker-name-input:focus { border-color: var(--accent); }
  .worker-name-input::placeholder { color: var(--muted); }
  .type-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .type-btn:hover { border-color: var(--accent); color: var(--text); }
  .type-btn.active { background: rgba(126,245,106,0.1); border-color: var(--accent); color: var(--accent); }

  /* WORKERS GRID */
  .workers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 32px; }

  .worker-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.2s; }
  .worker-card:hover { border-color: rgba(126,245,106,0.3); }
  .worker-card.running { border-color: rgba(126,245,106,0.5); box-shadow: 0 0 20px rgba(126,245,106,0.08); }

  .wc-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--surface2); }
  .wc-info { display: flex; align-items: center; gap: 10px; }
  .wc-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(126,245,106,0.15); border: 1px solid rgba(126,245,106,0.3); display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .wc-name { font-weight: 700; font-size: 14px; }
  .wc-type { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .wc-actions { display: flex; gap: 6px; }
  .wc-run-btn { background: var(--accent); color: #0c0f0a; border: none; border-radius: 6px; padding: 6px 12px; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; }
  .wc-run-btn:hover { background: #9dff8a; }
  .wc-run-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* JOB INPUT inside card */
  .wc-body { padding: 14px 16px; }
  .mini-form { display: grid; grid-template-columns: 1fr 60px 70px auto; gap: 6px; margin-bottom: 10px; align-items: end; }
  .mini-field label { font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
  .mini-field input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px; outline: none; transition: border-color 0.15s; }
  .mini-field input:focus { border-color: var(--accent); }
  .mini-field input::placeholder { color: var(--muted); }
  .mini-add-btn { background: var(--accent); color: #0c0f0a; border: none; border-radius: 6px; padding: 7px 12px; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; }
  .mini-add-btn:hover { background: #9dff8a; }

  /* Job list inside card */
  .job-list { max-height: 160px; overflow-y: auto; margin-bottom: 10px; }
  .job-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
  .job-row:hover { background: var(--surface2); }
  .job-row .jn { font-weight: 600; flex: 1; }
  .job-row .jd { font-family: 'JetBrains Mono', monospace; color: var(--accent3); margin: 0 8px; }
  .job-row .jp { font-family: 'JetBrains Mono', monospace; color: var(--accent2); font-weight: 500; }
  .job-row .jx { color: var(--danger); background: none; border: none; cursor: pointer; font-size: 11px; padding: 2px 4px; }
  .no-jobs { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
  .load-sample-link { color: var(--accent); text-decoration: underline; cursor: pointer; background: none; border: none; font-family: 'Syne', sans-serif; font-size: 12px; }

  /* Result inside card */
  .wc-result { border-top: 1px solid var(--border); padding: 12px 16px; display: none; }
  .wc-result.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .result-mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .rms { background: var(--surface2); border-radius: 6px; padding: 8px; text-align: center; }
  .rms .rl { font-size: 9px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-transform: uppercase; margin-bottom: 2px; }
  .rms .rv { font-size: 16px; font-weight: 800; }
  .rms .rv.green { color: var(--accent); }
  .mini-timeline { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 8px; }
  .mt-slot { flex: 1; min-width: 45px; background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 6px 4px; text-align: center; }
  .mt-slot.filled { background: rgba(126,245,106,0.08); border-color: rgba(126,245,106,0.3); }
  .mt-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); }
  .mt-job { font-size: 10px; font-weight: 700; color: var(--accent); }
  .mt-slot.empty .mt-job { color: var(--muted); font-weight: 400; font-size: 9px; }
  .mt-profit { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--accent2); }

  /* RUN ALL */
  .run-all-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center; }
  .run-all-info { font-size: 14px; color: var(--muted); }
  .run-all-info span { color: var(--accent); font-weight: 700; }
  .btn-run-all { background: var(--accent); color: #0c0f0a; border: none; border-radius: 10px; padding: 14px 36px; font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
  .btn-run-all:hover { background: #9dff8a; transform: translateY(-1px); }

  /* COMBINED RESULT */
  .combined-result { display: none; }
  .combined-result.show { display: block; animation: fadeIn 0.4s ease; }
  .combined-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .combined-title { font-size: 20px; font-weight: 800; }
  .combined-badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); background: rgba(126,245,106,0.1); border: 1px solid rgba(126,245,106,0.2); padding: 4px 12px; border-radius: 20px; }
  .combined-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .combined-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .cc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cc-name { font-weight: 700; font-size: 14px; }
  .cc-profit { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; color: var(--accent); }
  .cc-jobs { display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-tag { background: rgba(126,245,106,0.08); border: 1px solid rgba(126,245,106,0.2); color: var(--accent); font-size: 11px; padding: 3px 8px; border-radius: 20px; font-family: 'JetBrains Mono', monospace; }
  .cc-tag.skip { background: rgba(245,106,106,0.08); border-color: rgba(245,106,106,0.2); color: var(--danger); }

  .divider { height: 1px; background: var(--border); margin: 28px 0; }

  .empty-workers { text-align: center; padding: 60px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-workers p { font-size: 14px; margin-bottom: 8px; }

  @media(max-width: 700px) {
    .topbar { padding: 12px 16px; }
    .content { padding: 20px 12px; }
    .platform-stats { grid-template-columns: 1fr 1fr; }
    .workers-grid { grid-template-columns: 1fr; }
    .mini-form { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 20 20" fill="none">
        <rect x="2" y="4" width="4" height="12" rx="1" fill="#0c0f0a"/>
        <rect x="8" y="7" width="4" height="9" rx="1" fill="#0c0f0a"/>
        <rect x="14" y="2" width="4" height="14" rx="1" fill="#0c0f0a"/>
      </svg>
    </div>
    <div class="logo-text">JobMax</div>
    <div class="logo-badge">⚡ Parallel Scheduler</div>
  </div>
  <div class="topbar-right">
    <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">← Dashboard</button>
  </div>
</div>

<div class="content">

  <!-- Platform Stats -->
  <div class="platform-stats">
    <div class="pstat highlight">
      <div class="ps-label">Combined Profit</div>
      <div class="ps-val green" id="total-profit">₹0</div>
    </div>
    <div class="pstat">
      <div class="ps-label">Active Workers</div>
      <div class="ps-val" id="total-workers">0</div>
    </div>
    <div class="pstat">
      <div class="ps-label">Total Jobs Scheduled</div>
      <div class="ps-val" id="total-scheduled">0</div>
    </div>
    <div class="pstat">
      <div class="ps-label">Efficiency Rate</div>
      <div class="ps-val" id="efficiency">0%</div>
    </div>
  </div>

  <!-- Add Worker -->
  <div class="section-label">Add Worker</div>
  <div class="add-worker-bar">
    <input type="text" class="worker-name-input" id="worker-name" placeholder="Worker name..." />
    <button class="type-btn active" onclick="selectType(this,'Labour')">👷 Labour</button>
    <button class="type-btn" onclick="selectType(this,'Carpenter')">🪚 Carpenter</button>
    <button class="type-btn" onclick="selectType(this,'Plumber')">🔧 Plumber</button>
    <button class="type-btn" onclick="selectType(this,'Electrician')">⚡ Electric</button>
    <button class="type-btn" onclick="selectType(this,'Painter')">🎨 Painter</button>
    <button class="btn btn-primary" onclick="addWorker()">+ Add Worker</button>
  </div>

  <!-- Run All -->
  <div class="run-all-bar">
    <div class="run-all-info">
      <span id="worker-count-label">0 workers</span> ready to schedule in parallel
    </div>
    <button class="btn-run-all" onclick="runAllWorkers()">▶▶ Run All Workers</button>
  </div>

  <!-- Workers Grid -->
  <div class="section-label">Worker Schedules</div>
  <div class="workers-grid" id="workers-grid">
    <div class="empty-workers" id="empty-msg">
      <p>No workers added yet.</p>
      <p>Add workers above to start scheduling in parallel!</p>
    </div>
  </div>

  <!-- Combined Result -->
  <div class="combined-result" id="combined-result">
    <div class="divider"></div>
    <div class="combined-header">
      <div class="combined-title">Combined Schedule Result</div>
      <div class="combined-badge" id="combined-badge">0 workers</div>
    </div>
    <div class="combined-grid" id="combined-grid"></div>
  </div>

</div>

<script>
  let workers = [];
  let workerIdCounter = 1;
  let selectedType = 'Labour';

  const workerIcons = { Labour: '👷', Carpenter: '🪚', Plumber: '🔧', Electrician: '⚡', Painter: '🎨' };

  function selectType(btn, type) {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = type;
  }

  function addWorker() {
    const name = document.getElementById('worker-name').value.trim() || `Worker ${workerIdCounter}`;
    const worker = { id: workerIdCounter++, name, type: selectedType, jobs: [], result: null };
    workers.push(worker);
    document.getElementById('worker-name').value = '';
    renderWorkers();
    updateStats();
  }

  function removeWorker(id) {
    workers = workers.filter(w => w.id !== id);
    renderWorkers();
    updateStats();
    updateCombinedResult();
  }

  function addJobToWorker(wid) {
    const name = document.getElementById(`jname-${wid}`).value.trim();
    const deadline = parseInt(document.getElementById(`jdeadline-${wid}`).value);
    const profit = parseInt(document.getElementById(`jprofit-${wid}`).value);
    if (!name || !deadline || !profit || deadline < 1 || profit < 1) { alert('Fill all job fields!'); return; }
    const w = workers.find(w => w.id === wid);
    w.jobs.push({ id: Date.now(), name, deadline, profit });
    document.getElementById(`jname-${wid}`).value = '';
    document.getElementById(`jdeadline-${wid}`).value = '';
    document.getElementById(`jprofit-${wid}`).value = '';
    renderJobList(wid);
  }

  function removeJobFromWorker(wid, jid) {
    const w = workers.find(w => w.id === wid);
    w.jobs = w.jobs.filter(j => j.id !== jid);
    renderJobList(wid);
  }

  function loadSampleForWorker(wid) {
    const w = workers.find(w => w.id === wid);
    const samples = [
      { id: Date.now()+1, name: 'Fix Pipe', deadline: 2, profit: 500 },
      { id: Date.now()+2, name: 'Build Shelf', deadline: 1, profit: 300 },
      { id: Date.now()+3, name: 'Paint Room', deadline: 3, profit: 400 },
      { id: Date.now()+4, name: 'Lay Floor', deadline: 2, profit: 700 },
      { id: Date.now()+5, name: 'Wire Board', deadline: 3, profit: 600 },
    ];
    w.jobs = samples;
    renderJobList(wid);
  }

  // ── GREEDY ALGORITHM ──
  function greedySchedule(jobs) {
    if (!jobs.length) return { scheduled: [], skipped: [], totalProfit: 0, slots: [] };
    const sorted = [...jobs].sort((a, b) => b.profit - a.profit);
    const maxDeadline = Math.max(...jobs.map(j => j.deadline));
    const slots = new Array(maxDeadline).fill(null);
    const scheduled = [], skipped = [];
    for (const job of sorted) {
      let placed = false;
      for (let t = Math.min(job.deadline, maxDeadline) - 1; t >= 0; t--) {
        if (!slots[t]) { slots[t] = job; scheduled.push({ ...job, slot: t + 1 }); placed = true; break; }
      }
      if (!placed) skipped.push(job);
    }
    return { scheduled, skipped, totalProfit: scheduled.reduce((s, j) => s + j.profit, 0), slots };
  }

  function runWorker(wid) {
    const w = workers.find(w => w.id === wid);
    if (!w.jobs.length) { alert('Add jobs first!'); return; }
    w.result = greedySchedule(w.jobs);
    renderWorkerResult(wid);
    updateStats();
    updateCombinedResult();
  }

  function runAllWorkers() {
    if (!workers.length) { alert('Add at least one worker first!'); return; }
    let ran = 0;
    workers.forEach(w => {
      if (w.jobs.length) { w.result = greedySchedule(w.jobs); ran++; }
    });
    renderWorkers();
    updateStats();
    updateCombinedResult();
    if (ran === 0) alert('Add jobs to workers first!');
  }

  function renderJobList(wid) {
    const w = workers.find(w => w.id === wid);
    const el = document.getElementById(`job-list-${wid}`);
    if (!w.jobs.length) {
      el.innerHTML = `<div class="no-jobs">No jobs yet. <button class="load-sample-link" onclick="loadSampleForWorker(${wid})">Load sample</button></div>`;
    } else {
      el.innerHTML = w.jobs.map(j => `
        <div class="job-row">
          <span class="jn">${j.name}</span>
          <span class="jd">T${j.deadline}</span>
          <span class="jp">₹${j.profit}</span>
          <button class="jx" onclick="removeJobFromWorker(${wid},${j.id})">✕</button>
        </div>`).join('');
    }
  }

  function renderWorkerResult(wid) {
    const w = workers.find(w => w.id === wid);
    if (!w.result) return;
    const r = w.result;
    const el = document.getElementById(`result-${wid}`);
    el.innerHTML = `
      <div class="result-mini-stats">
        <div class="rms"><div class="rl">Profit</div><div class="rv green">₹${r.totalProfit.toLocaleString()}</div></div>
        <div class="rms"><div class="rl">Scheduled</div><div class="rv">${r.scheduled.length}</div></div>
        <div class="rms"><div class="rl">Skipped</div><div class="rv">${r.skipped.length}</div></div>
      </div>
      <div class="mini-timeline">
        ${r.slots.map((job, i) => job
          ? `<div class="mt-slot filled"><div class="mt-time">T${i+1}</div><div class="mt-job">${job.name.length>8?job.name.slice(0,7)+'…':job.name}</div><div class="mt-profit">₹${job.profit}</div></div>`
          : `<div class="mt-slot empty"><div class="mt-time">T${i+1}</div><div class="mt-job">idle</div></div>`
        ).join('')}
      </div>`;
    el.classList.add('show');
    document.getElementById(`card-${wid}`).classList.add('running');
  }

  function renderWorkers() {
    const grid = document.getElementById('workers-grid');
    const emptyMsg = document.getElementById('empty-msg');
    document.getElementById('worker-count-label').textContent = `${workers.length} worker${workers.length !== 1 ? 's' : ''}`;
    if (!workers.length) {
      grid.innerHTML = '';
      grid.appendChild(emptyMsg);
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    grid.innerHTML = workers.map(w => `
      <div class="worker-card" id="card-${w.id}">
        <div class="wc-header">
          <div class="wc-info">
            <div class="wc-avatar">${workerIcons[w.type] || '👷'}</div>
            <div>
              <div class="wc-name">${w.name}</div>
              <div class="wc-type">${w.type}</div>
            </div>
          </div>
          <div class="wc-actions">
            <button class="wc-run-btn" onclick="runWorker(${w.id})">▶ Run</button>
            <button class="btn-danger-sm" onclick="removeWorker(${w.id})">✕</button>
          </div>
        </div>
        <div class="wc-body">
          <div class="mini-form">
            <div class="mini-field"><label>Job</label><input type="text" id="jname-${w.id}" placeholder="Job name" /></div>
            <div class="mini-field"><label>DL</label><input type="number" id="jdeadline-${w.id}" placeholder="T" min="1" /></div>
            <div class="mini-field"><label>₹</label><input type="number" id="jprofit-${w.id}" placeholder="0" min="1" /></div>
            <button class="mini-add-btn" onclick="addJobToWorker(${w.id})">+</button>
          </div>
          <div class="job-list" id="job-list-${w.id}">
            <div class="no-jobs">No jobs yet. <button class="load-sample-link" onclick="loadSampleForWorker(${w.id})">Load sample</button></div>
          </div>
        </div>
        <div class="wc-result" id="result-${w.id}"></div>
      </div>`).join('');

    // re-render job lists and results
    workers.forEach(w => {
      if (w.jobs.length) renderJobList(w.id);
      if (w.result) renderWorkerResult(w.id);
    });
  }

  function updateStats() {
    const ran = workers.filter(w => w.result);
    const totalProfit = ran.reduce((s, w) => s + (w.result?.totalProfit || 0), 0);
    const totalScheduled = ran.reduce((s, w) => s + (w.result?.scheduled.length || 0), 0);
    const totalJobs = ran.reduce((s, w) => s + w.jobs.length, 0);
    const efficiency = totalJobs > 0 ? Math.round((totalScheduled / totalJobs) * 100) : 0;
    document.getElementById('total-profit').textContent = '₹' + totalProfit.toLocaleString();
    document.getElementById('total-workers').textContent = workers.length;
    document.getElementById('total-scheduled').textContent = totalScheduled;
    document.getElementById('efficiency').textContent = efficiency + '%';
  }

  function updateCombinedResult() {
    const ran = workers.filter(w => w.result);
    if (!ran.length) { document.getElementById('combined-result').classList.remove('show'); return; }
    document.getElementById('combined-badge').textContent = `${ran.length} worker${ran.length !== 1 ? 's' : ''}`;
    document.getElementById('combined-grid').innerHTML = ran.map(w => `
      <div class="combined-card">
        <div class="cc-head">
          <div>
            <div class="cc-name">${workerIcons[w.type]} ${w.name}</div>
            <div style="font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;">${w.type}</div>
          </div>
          <div class="cc-profit">₹${w.result.totalProfit.toLocaleString()}</div>
        </div>
        <div class="cc-jobs">
          ${w.result.scheduled.map(j => `<span class="cc-tag">${j.name}</span>`).join('')}
          ${w.result.skipped.length ? `<span class="cc-tag skip">+${w.result.skipped.length} skipped</span>` : ''}
        </div>
      </div>`).join('');
    document.getElementById('combined-result').classList.add('show');
    document.getElementById('combined-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Load 3 sample workers on start
  function loadDemo() {
    const demo = [
      { name: 'Ramesh', type: 'Plumber', jobs: [{id:1,name:'Fix Pipe',deadline:2,profit:500},{id:2,name:'Install Sink',deadline:1,profit:300},{id:3,name:'Repair Tap',deadline:3,profit:400}] },
      { name: 'Suresh', type: 'Carpenter', jobs: [{id:4,name:'Build Cabinet',deadline:1,profit:700},{id:5,name:'Fix Door',deadline:2,profit:600},{id:6,name:'Table Repair',deadline:3,profit:450}] },
      { name: 'Mahesh', type: 'Electrician', jobs: [{id:7,name:'Wire Circuit',deadline:3,profit:800},{id:8,name:'Fix Switch',deadline:1,profit:250},{id:9,name:'Install Fan',deadline:2,profit:550}] },
    ];
    demo.forEach(d => {
      workers.push({ id: workerIdCounter++, name: d.name, type: d.type, jobs: d.jobs, result: null });
    });
    renderWorkers();
    updateStats();
  }

  loadDemo();
</script>
</body>
</html>
